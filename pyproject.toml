[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "opencal"
dynamic = ["version"]
description = "Free, offline calibration editor for Bosch EDC15P/V (VAG TDI PD) ECUs"
readme = "README.md"
license = { text = "GPL-3.0-only" }
requires-python = ">=3.11"
authors = [{ name = "OpenCal contributors" }]
dependencies = ["PySide6>=6.6", "numpy>=1.26", "pyqtgraph>=0.13.4", "PyOpenGL>=3.1.7", "pyserial>=3.5"]

[project.scripts]
opencal = "opencal.__main__:main"

[tool.setuptools.dynamic]
version = { attr = "opencal.__version__" }

[tool.setuptools.packages.find]
include = ["opencal*"]

[tool.setuptools.package-data]
"opencal.legacy" = ["data/*.json", "data/c166/*"]
