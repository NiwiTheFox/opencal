name: Test and release

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.13']
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s tests -t . -v

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: test
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'
      - name: Install build dependencies
        run: python -m pip install -r requirements.txt pyinstaller
      - name: Build self-contained executable and portable ZIP
        run: python tools/build_exe.py
      - name: Smoke-test the built executable
        shell: pwsh
        run: |
          $exe = Get-ChildItem dist/OpenCal-*-win64.exe | Select-Object -First 1
          if (-not $exe) { throw 'Executable missing.' }
          if ($exe.Length -lt 20MB) { throw 'Executable is suspiciously small.' }
      - name: Checksums
        shell: pwsh
        run: |
          Get-ChildItem dist/OpenCal-* | ForEach-Object {
            (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower() + '  ' + $_.Name | Out-File -Encoding ascii -Append dist/SHA256SUMS.txt }
      - name: Publish pre-release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          $v = $env:RELEASE_TAG.TrimStart('v')
          gh release create $env:RELEASE_TAG "dist/OpenCal-$v-win64.exe" "dist/OpenCal-$v-win64.zip" "dist/SHA256SUMS.txt" --title "OpenCal $v" --notes-file docs/RELEASE-NOTES.md --prerelease --verify-tag
