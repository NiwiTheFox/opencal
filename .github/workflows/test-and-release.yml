name: Test and release

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.13', '3.14']
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python }}
      - run: python -m unittest discover -s tests -v
      - run: python -m tests.gui_smoke

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: test
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'
      - name: Build Windows launcher
        shell: pwsh
        run: ./tools/Build-Launcher.ps1
      - name: Package public source and launcher
        shell: pwsh
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          $releaseVersion = $env:RELEASE_TAG.TrimStart('v')
          python tools/package_release.py --version $releaseVersion --output "dist/OpenCal-$releaseVersion-source.zip"
      - name: Bundle Python and Tcl/Tk
        shell: pwsh
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          $releaseVersion = $env:RELEASE_TAG.TrimStart('v')
          python -m tools.build_portable --version $releaseVersion --directory "dist/OpenCal-$releaseVersion-Windows" --output "dist/OpenCal-$releaseVersion-Windows.zip"
      - name: Test the bundled runtime and app
        shell: pwsh
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          $releaseVersion = $env:RELEASE_TAG.TrimStart('v')
          Push-Location "dist/OpenCal-$releaseVersion-Windows"
          ./runtime/python.exe -m unittest discover -s tests -v
          if ($LASTEXITCODE -ne 0) { throw 'Bundled runtime tests failed.' }
          ./runtime/python.exe -m tests.gui_smoke
          if ($LASTEXITCODE -ne 0) { throw 'Bundled GUI smoke failed.' }
          Pop-Location
      - name: Publish tested source and portable downloads
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          $releaseVersion = $env:RELEASE_TAG.TrimStart('v')
          gh release create $env:RELEASE_TAG "dist/OpenCal-$releaseVersion-source.zip" "dist/OpenCal-$releaseVersion-source.zip.sha256" "dist/OpenCal-$releaseVersion-Windows.zip" "dist/OpenCal-$releaseVersion-Windows.zip.sha256" --title "OpenCal $releaseVersion" --notes-file docs/RELEASE-NOTES.md --prerelease --verify-tag
